name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Signing script test (stubbed codesign and security)
        run: scripts/test-signing-stubs.sh
      - name: Bundle (explicit ad-hoc fallback) and self-test
        run: |
          SIGNING_IDENTITY=- scripts/bundle.sh 0.0.0-ci
          PLIST=dist/Shadow.app/Contents/Info.plist
          COMMIT="$(/usr/libexec/PlistBuddy -c 'Print :ShadowCommit' "$PLIST")"
          REPO="$(/usr/libexec/PlistBuddy -c 'Print :ShadowRepo' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          test -n "$COMMIT" && test "$COMMIT" != unknown
          test -n "$REPO"
          test "$VERSION" = "0.0.0-ci"
          OUT="$(dist/Shadow.app/Contents/MacOS/Shadow --self-test)"
          echo "$OUT"
          test "$OUT" = "ok $COMMIT"
          dist/Shadow.app/Contents/MacOS/shadow-mcp --version
      - name: Check designated requirement (ad-hoc fallback)
        run: scripts/check-signing.sh --adhoc-fallback dist/Shadow.app
      - name: Signing shell test (throwaway keychain)
        timeout-minutes: 10
        run: scripts/test-signing.sh
