name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z); must already exist'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Validate tag is a semantic version
        id: ver
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z; not releasing."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Import signing certificate
        id: sign
        env:
          SIGN_IDENTITY_SECRET: ${{ secrets.SIGN_IDENTITY }}
          SIGN_CERT_P12: ${{ secrets.SIGN_CERT_P12 }}
          SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          SIGNING_P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          # Precedence: Developer ID + notarization, then the self-signed "Shadow Signing" p12, then ad-hoc.
          KIND=adhoc
          P12_B64=""; P12_PW=""
          if [ -n "$SIGN_IDENTITY_SECRET" ] && [ -n "$SIGN_CERT_P12" ] && [ -n "$SIGN_CERT_PASSWORD" ] \
             && [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            KIND=developerid; P12_B64="$SIGN_CERT_P12"; P12_PW="$SIGN_CERT_PASSWORD"
          elif [ -n "$SIGNING_P12_BASE64" ] && [ -n "$SIGNING_P12_PASSWORD" ]; then
            KIND=selfsigned; P12_B64="$SIGNING_P12_BASE64"; P12_PW="$SIGNING_P12_PASSWORD"
          fi
          echo "kind=$KIND" >> "$GITHUB_OUTPUT"
          if [ "$KIND" != adhoc ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "::add-mask::$KEYCHAIN_PASSWORD"
            echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"
            security list-keychains -d user | tr -d ' "' > "$RUNNER_TEMP/keychains.txt"
            echo "$P12_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$P12_PW" -T /usr/bin/codesign -t cert -f pkcs12 -k "$KEYCHAIN" >/dev/null
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
            security list-keychains -d user -s "$KEYCHAIN" $(cat "$RUNNER_TEMP/keychains.txt")
            rm -f "$RUNNER_TEMP/cert.p12"
          fi
          if [ "$KIND" = developerid ]; then
            echo "identity=$SIGN_IDENTITY_SECRET" >> "$GITHUB_OUTPUT"
          elif [ "$KIND" = selfsigned ]; then
            echo "identity=Shadow Signing" >> "$GITHUB_OUTPUT"
          else
            echo "identity=-" >> "$GITHUB_OUTPUT"
          fi
      - name: Bundle
        env:
          SIGNING_IDENTITY: ${{ steps.sign.outputs.identity }}
          SIGNING_KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: |
          APP_REPO=$GITHUB_REPOSITORY scripts/bundle.sh "${{ steps.ver.outputs.version }}"
      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release dmgroot
          cp -R dist/Shadow.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname Shadow -srcfolder dmgroot -ov -format UDZO "release/Shadow-$VERSION.dmg"
      - name: Notarize
        if: steps.sign.outputs.kind == 'developerid'
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          xcrun notarytool submit "release/Shadow-$VERSION.dmg" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "release/Shadow-$VERSION.dmg"
      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          KIND: ${{ steps.sign.outputs.kind }}
        run: |
          case "$KIND" in
            developerid) NOTE="Signed with a Developer ID certificate and notarized. Permissions carry over from earlier builds signed the same way." ;;
            selfsigned) NOTE="Signed with the self-signed Shadow Signing identity and not notarized. On first launch, right-click Shadow.app and choose Open once. Screen Recording and Microphone permissions carry over between builds signed with this identity." ;;
            *) NOTE="This build is ad-hoc signed and not notarized, so macOS permissions (Screen Recording, Microphone) will reset on every update. On first launch, right-click Shadow.app and choose Open once." ;;
          esac
          gh release create "$TAG" release/*.dmg release/SHA256SUMS --title "Shadow ${TAG#v}" --generate-notes --notes "$NOTE"
      - name: Remove signing keychain
        if: always()
        env:
          KEYCHAIN: ${{ steps.sign.outputs.keychain }}
        run: |
          if [ -n "$KEYCHAIN" ]; then
            if [ -f "$RUNNER_TEMP/keychains.txt" ]; then security list-keychains -d user -s $(cat "$RUNNER_TEMP/keychains.txt") || true; fi
            security delete-keychain "$KEYCHAIN" || true
          fi
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/keychains.txt"
