name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (vX.Y.Z); must already exist'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      SIGN_IDENTITY_SECRET: ${{ secrets.SIGN_IDENTITY }}
      SIGN_CERT_P12: ${{ secrets.SIGN_CERT_P12 }}
      SIGN_CERT_PASSWORD: ${{ secrets.SIGN_CERT_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Validate tag is a semantic version
        id: ver
        run: |
          if ! [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z; not releasing."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Import signing certificate
        id: sign
        run: |
          if [ -n "$SIGN_IDENTITY_SECRET" ] && [ -n "$SIGN_CERT_P12" ] && [ -n "$SIGN_CERT_PASSWORD" ] \
             && [ -n "$NOTARY_APPLE_ID" ] && [ -n "$NOTARY_TEAM_ID" ] && [ -n "$NOTARY_PASSWORD" ]; then
            KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
            KEYCHAIN_PASSWORD="$(uuidgen)"
            echo "$SIGN_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security set-keychain-settings -lut 21600 "$KEYCHAIN"
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security import "$RUNNER_TEMP/cert.p12" -P "$SIGN_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
            security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
            security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
            rm -f "$RUNNER_TEMP/cert.p12"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Bundle
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then export SIGN_IDENTITY="$SIGN_IDENTITY_SECRET"; fi
          APP_REPO=$GITHUB_REPOSITORY scripts/bundle.sh "${{ steps.ver.outputs.version }}"
      - name: Create DMG
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p release dmgroot
          cp -R dist/Shadow.app dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname Shadow -srcfolder dmgroot -ov -format UDZO "release/Shadow-$VERSION.dmg"
      - name: Notarize
        if: steps.sign.outputs.signed == 'true'
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          xcrun notarytool submit "release/Shadow-$VERSION.dmg" --apple-id "$NOTARY_APPLE_ID" --team-id "$NOTARY_TEAM_ID" --password "$NOTARY_PASSWORD" --wait
          xcrun stapler staple "release/Shadow-$VERSION.dmg"
      - name: Checksums
        run: |
          cd release
          shasum -a 256 *.dmg > SHA256SUMS
          cat SHA256SUMS
      - name: Publish release
        env:
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            NOTE="Signed with a Developer ID certificate and notarized."
          else
            NOTE="This build is ad-hoc signed and not notarized. On first launch, right-click Shadow.app and choose Open once."
          fi
          gh release create "$TAG" release/*.dmg release/SHA256SUMS --title "Shadow ${TAG#v}" --generate-notes --notes "$NOTE"
